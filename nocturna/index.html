<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rueda nocturna, una maravillosa manera de recorrer medellín en la noche">
    <title>Rueda Nocturna</title>
    <link rel="stylesheet" href="../src/output.css">
  </head>
  <body class="bg-slate-950 text-slate-100">
    <main class="min-h-screen flex items-center justify-center px-6 py-16">

      <section class="w-full max-w-4xl mx-auto bg-slate-900 rounded-2xl p-8 md:p-14 space-y-8">

        <p class="text-sm font-semibold uppercase tracking-widest text-yellow-400">
          Nuevo · Jueves a sábado
        </p>

        <div class="space-y-4">
          <h1 class="text-4xl md:text-6xl font-bold tracking-tight">
            Rueda Nocturna
          </h1>

          <p class="text-lg md:text-xl text-slate-300 leading-relaxed">
            Descubre Medellín en bici cuando se encienden las luces.
          </p>
        </div>

        <div class="flex flex-wrap gap-4">
          <div class="bg-slate-800 rounded-xl p-5">
            <p class="text-3xl font-bold text-yellow-300">3</p>
            <p class="text-sm text-slate-300">rutas</p>
          </div>

          <div class="bg-slate-800 rounded-xl p-5">
            <p class="text-3xl font-bold text-yellow-400">Desde $55.000</p>
            <p class="text-sm text-slate-300">por persona</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-4">

          <!-- Primario -->
          <a href="#inscripcion"
            class="inline-block rounded-lg bg-yellow-400 px-8 py-4 text-base font-bold text-slate-950
                   hover:bg-yellow-300
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300
                   focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
            Inscríbete
          </a>

          <!-- Secundario -->
          <a href="#rutas"
            class="inline-block rounded-lg border border-slate-600 bg-slate-800 px-8 py-4 text-base font-bold text-slate-100
                   hover:border-slate-400 hover:bg-slate-700
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300
                   focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
            Ver rutas
          </a>

          <!-- Fantasma -->
          <a href="#info"
            class="inline-block rounded-lg px-8 py-4 text-base font-bold text-yellow-300
                   hover:bg-yellow-400/10 hover:text-yellow-200
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300
                   focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
            Más información
          </a>

        </div>

      </section>

    </main>
  </body>
</html>
